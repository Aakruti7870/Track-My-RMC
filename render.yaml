services:
  - type: web
    name: trackmyrmc-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trackmyrmc-postgres
          property: connectionString
      # Must be a unique random value of at least 64 bytes; configure it in the Render dashboard.
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_HOURS
        value: "24"
      # Required in production; set a unique random value in the Render dashboard.
      - key: OTP_PEPPER
        sync: false
      # Configure the exact browser origins used by the deployed web apps.
      # Do not use "*" in production.
      - key: CORS_ORIGIN
        sync: false
      - key: APP_ENV
        value: "production"
      - key: RUST_LOG
        value: "info,trackmyrmc_backend=debug"
      - key: META_WHATSAPP_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_WABA_ID
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        value: "noreply@trackmyrmc.com"
      - key: OTP_EXPIRATION_MINUTES
        value: "5"
      - key: OTP_COOLDOWN_SECONDS
        value: "60"
      - key: OTP_MAX_ATTEMPTS
        value: "3"

databases:
  - name: trackmyrmc-postgres
    databaseName: trackmyrmc
    user: trackmyrmc_user
    region: singapore
    plan: starter
