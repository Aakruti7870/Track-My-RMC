[package]
name = "trackmyrmc-backend"
version = "1.0.0"
edition = "2021"
authors = ["TrackMyRMC Engineering"]
description = "Production-ready Rust/Axum/PostgreSQL backend for TrackMyRMC (Twilio removed, Meta WhatsApp & TOTP enabled)"

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart", "ws"] }
tokio = { version = "1.38", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-full", "timeout"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "uuid",
    "chrono",
    "migrate",
    "bigdecimal"
] }
uuid = { version = "1.8", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
jsonwebtoken = "9.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
thiserror = "1.0"
validator = { version = "0.18", features = ["derive"] }
bigdecimal = { version = "0.3.1", features = ["serde"] }
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
base64 = "0.22"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
