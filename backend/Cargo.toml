[package]
name = "trackmyrmc-backend"
version = "1.0.0"
edition = "2021"
authors = ["TrackMyRMC Engineering"]
description = "Production-ready Rust/Axum/PostgreSQL backend for TrackMyRMC (Twilio removed, Meta WhatsApp & TOTP enabled)"

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart", "ws"] }
tokio = { version = "=1.54.1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-full", "timeout"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "bigdecimal"
] }
uuid = { version = "1.8", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
jsonwebtoken = { version = "10.3", default-features = false, features = ["aws_lc_rs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
thiserror = "1.0"
bigdecimal = { version = "0.4", features = ["serde"] }
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
base64 = "0.22"
hex = "0.4"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }

# SQLx 0.8.6 pins optional SQLite to vulnerable libsqlite3-sys 0.30.x.
# Keep PostgreSQL APIs unchanged while resolving the patched SQLite library.
[patch.crates-io]
sqlx-sqlite = { path = "vendor/sqlx-sqlite-0.8.6" }
