  <path d="M17.2 35 L39 35" stroke="#FFFFFF" stroke-width="1.6" stroke-opacity="0.85" />
  <path d="M20 45.7 L40 45.7" stroke="#16232A" stroke-width="1" stroke-opacity="0.23" stroke-linecap="round" />
