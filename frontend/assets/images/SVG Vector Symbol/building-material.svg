<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="building-material-brick" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBBF24" />
      <stop offset="1" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="building-material-brick-shade" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAAE66" />
      <stop offset="1" stop-color="#BC6A29" />
    </linearGradient>
    <linearGradient id="building-material-aggregate" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748B" />
      <stop offset="1" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="building-material-plate" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
