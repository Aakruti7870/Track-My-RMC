    </linearGradient>
  </defs>
  <rect x="8" y="12" width="48" height="47" rx="15" fill="#16232A" opacity="0.16" />
  <rect x="7" y="6" width="50" height="50" rx="15" fill="url(#building-material-plate)" />
  <rect x="7.9" y="6.9" width="48.2" height="48.2" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.4" />
  <rect x="11" y="9" width="42" height="19" rx="11" fill="url(#building-material-sheen)" />
