  <path d="M37 39 L40 35 L43 37 L45 34" stroke="#FFFFFF" stroke-opacity="0.48" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <rect x="20" y="25" width="21" height="9" rx="1.7" fill="url(#building-material-brick)" />
