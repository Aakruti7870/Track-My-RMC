    <path d="M728 -55 L956 -55 C758 167 575 300 330 525 H108 C364 340 560 160 728 -55Z" fill="url(#diagonal)" opacity=".34"/>
    <path d="M1213 -65 L1368 -35 L899 531 L764 531Z" fill="url(#diagonal)" opacity=".26"/>
