    <path d="M280 -8 C211 111 120 252 -18 315" fill="none" stroke="#fffef8" stroke-width="2" opacity=".56"/>
    <path d="M1263 -60 L854 519" fill="none" stroke="#fff" stroke-width="8" opacity=".18" filter="url(#blur6)"/>
    <path d="M1263 -60 L854 519" fill="none" stroke="#fff" stroke-width="1.6" opacity=".27"/>
