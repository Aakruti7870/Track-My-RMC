      <stop offset="0.38" stop-color="#ebd5b9"/><stop offset="0.73" stop-color="#dbd1c7"/>
      <stop offset="1" stop-color="#a19b9b"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0.32">
