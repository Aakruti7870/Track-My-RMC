<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1536" height="515" viewBox="0 0 1536 515" role="img" aria-label="Light-theme frosted glass card with luminous amber edges">
  <defs>
