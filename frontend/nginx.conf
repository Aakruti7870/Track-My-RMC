server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Lightweight container health check that does not depend on Mongo/API state.
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Keep API traffic on the current production backend while the canonical
    # website host remains the only public origin.
    location = /api {
        proxy_pass https://tracking-preview-api-224495133432.asia-south1.run.app;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name tracking-preview-api-224495133432.asia-south1.run.app;
        proxy_set_header Host tracking-preview-api-224495133432.asia-south1.run.app;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass https://tracking-preview-api-224495133432.asia-south1.run.app;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name tracking-preview-api-224495133432.asia-south1.run.app;
        proxy_set_header Host tracking-preview-api-224495133432.asia-south1.run.app;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # Backend-owned machine/deep-link resources stay proxied. Human-facing legal
    # and KYC return pages intentionally do NOT appear here; they are rendered by
    # the current Expo web app so the public domain and Android app share one UI.
    location = /health {
        proxy_pass https://tracking-preview-api-224495133432.asia-south1.run.app;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name tracking-preview-api-224495133432.asia-south1.run.app;
        proxy_set_header Host tracking-preview-api-224495133432.asia-south1.run.app;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /.well-known/assetlinks.json {
        proxy_pass https://tracking-preview-api-224495133432.asia-south1.run.app;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name tracking-preview-api-224495133432.asia-south1.run.app;
        proxy_set_header Host tracking-preview-api-224495133432.asia-south1.run.app;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Older TrackMyRMC/Expo/CRA builds may have registered one of these workers.
    # Serve explicit self-retiring scripts instead of allowing SPA fallback to
    # return index.html for a worker update request (which leaves the old worker
    # installed and able to serve a stale first-load login shell).
    location = /service-worker.js {
        try_files $uri =404;
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location = /sw.js {
        try_files $uri =404;
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location = /expo-service-worker.js {
        try_files $uri =404;
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # Expo's hashed bundles are immutable and safe to cache aggressively.
    location /_expo/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never let the SPA shell itself become a long-lived cached document.
    location = /index.html {
        try_files $uri =404;
        etag off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Expo Router web output is a single-page application. This handles /login,
    # /privacy_policy, /terms, /account-deletion, /kyc/return and role screens.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
