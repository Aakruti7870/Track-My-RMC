name: Deploy TrackMyRMC AWS Production

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - ops/aws-deploy-ec2.sh
      - .github/workflows/deploy-aws-production.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: trackmyrmc-aws-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::260234292958:role/TrackMyRMC-GitHubDeploy
  ARTIFACT_BUCKET: trackmyrmc-prod-artifacts-260234292958-ap-south-1
  INSTANCE_ID: i-0598aad6e6d729c69
  APP_SECRET_NAME: trackmyrmc/app-runtime

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trackmyrmc_user
          POSTGRES_PASSWORD: securepassword
          POSTGRES_DB: trackmyrmc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Build Rust backend
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu
      - name: Validate deployment script
        run: bash -n ops/aws-deploy-ec2.sh
      - name: Rust format check
        working-directory: backend
        run: cargo fmt --all -- --check
      - name: Rust check
        run: cargo check --all-targets --manifest-path backend/Cargo.toml
      - name: Rust clippy
        run: cargo clippy --all-targets --manifest-path backend/Cargo.toml
      - name: Rust tests
        env:
          DATABASE_URL: postgres://trackmyrmc_user:securepassword@localhost:5432/trackmyrmc_test
          JWT_SECRET: test_jwt_secret_key_at_least_32_characters_long
        run: cargo test --manifest-path backend/Cargo.toml --verbose
      - name: Build Rust backend
        run: cargo build --release --manifest-path backend/Cargo.toml

      - name: Build Expo web
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: https://trackmyrmc.com
        run: |
          npm ci
          npm run typecheck
          npm run check:auth-routing
          npm run check:android-layout
          npm run build:preview
          test -f dist/index.html

      - name: Build admin dashboard
        working-directory: admin-web
        env:
          VITE_API_URL: https://trackmyrmc.com
        run: |
          npm install
          npm run build

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify production runtime secret exists
        run: |
          set -euo pipefail
          aws secretsmanager describe-secret --secret-id "${APP_SECRET_NAME}" >/dev/null
          echo "Runtime secret exists. The EC2 instance validates required fields locally before replacing the application release."

      - name: Upload release
        id: release
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          tar -C frontend -czf /tmp/frontend.tgz dist
          aws s3 cp backend/target/release/trackmyrmc-backend "s3://${ARTIFACT_BUCKET}/backend-${SHA}"
          aws s3 cp /tmp/frontend.tgz "s3://${ARTIFACT_BUCKET}/frontend-${SHA}.tgz"

      - name: Deploy EC2 through SSM
        run: |
          set -euo pipefail
          COMMAND_ID="$(aws ssm send-command             --instance-ids "${INSTANCE_ID}"             --document-name AWS-RunShellScript             --comment "TrackMyRMC production deploy ${GITHUB_SHA}"             --parameters commands="curl -fsSL "https://raw.githubusercontent.com/Aakruti7870/Track-My-RMC/${GITHUB_SHA}/ops/aws-deploy-ec2.sh" | RELEASE_SHA=${GITHUB_SHA} bash"             --query 'Command.CommandId'             --output text)"

          for i in $(seq 1 60); do
            STATUS="$(aws ssm get-command-invocation               --command-id "$COMMAND_ID"               --instance-id "${INSTANCE_ID}"               --query Status               --output text)"
            echo "SSM: $STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${INSTANCE_ID}"
                exit 1 ;;
            esac
            sleep 5
          done
          exit 1

      - name: Verify public HTTPS, API, and web assets
        run: |
          set -euo pipefail
          curl --retry 10 --retry-all-errors --retry-delay 3 -fsS https://trackmyrmc.com/health
          curl --retry 10 --retry-all-errors --retry-delay 3 -fsS https://trackmyrmc.com/ | grep -F '_expo/static/' >/dev/null
          curl --retry 10 --retry-all-errors --retry-delay 3 -fsSI https://trackmyrmc.com/ | grep -Eiq '^HTTP/[^ ]+ 200'
