name: Deploy TrackMyRMC AWS Production

# Automatic deployment runs only after ALL 3 main-branch CI workflows are
# successful and the independent recovery readiness flags have been approved.
# Both flags default to false. Live DB parity, snapshot, and rollback checks
# still reject unsafe releases. Merging main cannot implicitly bypass the gate.
on:
  workflow_run:
    workflows: ["Backend CI", "Frontend CI", "Android Build Validation"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Type yes only after the production recovery plan has been reviewed"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: trackmyrmc-aws-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::260234292958:role/TrackMyRMC-GitHubDeploy
  ARTIFACT_BUCKET: trackmyrmc-prod-artifacts-260234292958-ap-south-1
  INSTANCE_ID: i-0598aad6e6d729c69
  APP_SECRET_NAME: trackmyrmc/app-runtime

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       vars.TRACKMYRMC_AUTO_PRODUCTION_ENABLED == 'true' &&
       vars.TRACKMYRMC_RECOVERY_VERIFIED == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.confirm_production_deploy == 'yes' &&
       vars.TRACKMYRMC_RECOVERY_VERIFIED == 'true')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trackmyrmc_user
          POSTGRES_PASSWORD: securepassword
          POSTGRES_DB: trackmyrmc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Verify exact main SHA and three successful main CI workflows
        id: release_gate
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          SHA="$TRIGGER_SHA"
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$SHA" = "$CURRENT_SHA" || { echo "Refusing stale/non-main release."; exit 1; }
          RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=100")"
          for required in "Backend CI" "Frontend CI" "Android Build Validation"; do
            conclusion="$(jq -r --arg sha "$SHA" --arg wf "$required" \
              '[.workflow_runs[] | select(.head_sha == $sha and .name == $wf and .event == "push")] | sort_by(.created_at) | last | .conclusion // empty' <<<"$RUNS")"
            if [ "$conclusion" != "success" ]; then
              echo "Release blocked: $required on $SHA is ${conclusion:-missing}."
              exit 1
            fi
          done
          echo "RELEASE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "release_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "All three main CI workflows passed for $SHA."
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_gate.outputs.release_sha }}

      - name: Build Rust backend
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu
      - name: Validate deployment script
        run: bash -n ops/aws-deploy-ec2.sh
      - name: Rust format check
        working-directory: backend
        run: cargo fmt --all -- --check
      - name: Rust check
        run: cargo check --all-targets --manifest-path backend/Cargo.toml
      - name: Rust clippy
        run: cargo clippy --all-targets --manifest-path backend/Cargo.toml
      - name: Rust tests
        env:
          DATABASE_URL: postgres://trackmyrmc_user:securepassword@localhost:5432/trackmyrmc_test
          JWT_SECRET: test_jwt_secret_key_at_least_32_characters_long
        run: cargo test --manifest-path backend/Cargo.toml --verbose
      - name: Build Rust backend
        run: cargo build --release --manifest-path backend/Cargo.toml

      - name: Build Expo web
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: https://trackmyrmc.com
        run: |
          npm ci
          npm run typecheck
          npm run check:auth-routing
          npm run check:android-layout
          npm run build:preview
          test -f dist/index.html

      - name: Build admin dashboard
        working-directory: admin-web
        env:
          VITE_API_URL: https://trackmyrmc.com
        run: |
          npm install
          npm run build

      - name: Package complete source and admin dashboard
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="/tmp/source-${RELEASE_SHA}.tgz" "${RELEASE_SHA}"
          tar -C admin-web/dist -czf "/tmp/admin-web-${RELEASE_SHA}.tgz" .
          test -s "/tmp/source-${RELEASE_SHA}.tgz"
          test -s "/tmp/admin-web-${RELEASE_SHA}.tgz"

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fail closed on RDS data protection and backup state
        run: |
          set -euo pipefail
          DETAILS="$(aws rds describe-db-instances --db-instance-identifier trackmyrmc-postgres --output json)"
          jq -e '
            .DBInstances | length == 1 and
            .[0].DBName == "trackmyrmc" and
            .[0].DBInstanceStatus == "available" and
            .[0].Engine == "postgres" and
            .[0].StorageEncrypted == true and
            .[0].DeletionProtection == true and
            .[0].BackupRetentionPeriod >= 7 and
            (.[0].LatestRestorableTime != null)
          ' <<<"$DETAILS" >/dev/null || {
            echo "BLOCKED: production RDS settings or restore point do not meet the release gate."
            exit 1
          }
      - name: Confirm live database parity before any release mutation
        run: |
          set -euo pipefail
          REMOTE="set -eu; curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$RELEASE_SHA/ops/aws-production-preflight.sh -o /tmp/trackmyrmc-preflight-$RELEASE_SHA.sh; bash /tmp/trackmyrmc-preflight-$RELEASE_SHA.sh"
          PARAMS="$(jq -cn --arg cmd "$REMOTE" '{commands:[$cmd]}')"
          ID="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "TrackMyRMC production read-only DB preflight" --parameters "$PARAMS" \
            --query 'Command.CommandId' --output text)"
          for attempt in $(seq 1 40); do
            status="$(aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                echo "Production DB and app service preflight passed."
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "BLOCKED: production database/service preflight failed; refusing deployment."
                exit 1
                ;;
            esac
            [ "$attempt" -lt 40 ] || exit 1
            sleep 3
          done
      - name: Create a pre-deployment RDS recovery snapshot
        run: |
          set -euo pipefail
          SNAPSHOT_ID="trackmyrmc-release-${RELEASE_SHA:0:20}"
          if ! aws rds describe-db-snapshots --db-snapshot-identifier "$SNAPSHOT_ID" >/dev/null 2>&1; then
            aws rds create-db-snapshot --db-instance-identifier trackmyrmc-postgres \
              --db-snapshot-identifier "$SNAPSHOT_ID" >/dev/null
          fi
          aws rds wait db-snapshot-completed --db-snapshot-identifier "$SNAPSHOT_ID"
          echo "RDS recovery snapshot ready: $SNAPSHOT_ID"
      - name: Verify production runtime secret exists
        run: |
          set -euo pipefail
          aws secretsmanager describe-secret --secret-id "${APP_SECRET_NAME}" >/dev/null
          echo "Runtime secret exists. The EC2 instance validates required fields locally before replacing the application release."

      - name: Upload release
        id: release
        run: |
          set -euo pipefail
          SHA="${RELEASE_SHA}"
          tar -C frontend -czf /tmp/frontend.tgz dist
          aws s3 cp backend/target/release/trackmyrmc-backend "s3://${ARTIFACT_BUCKET}/backend-${SHA}"
          aws s3 cp /tmp/frontend.tgz "s3://${ARTIFACT_BUCKET}/frontend-${SHA}.tgz"
          aws s3 cp "/tmp/source-${SHA}.tgz" "s3://${ARTIFACT_BUCKET}/source-${SHA}.tgz"
          aws s3 cp "/tmp/admin-web-${SHA}.tgz" "s3://${ARTIFACT_BUCKET}/admin-web-${SHA}.tgz"

      - name: Deploy EC2 through SSM
        id: deploy_release
        run: |
          set -euo pipefail
          REMOTE="set -eu; curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$RELEASE_SHA/ops/aws-deploy-ec2.sh -o /tmp/trackmyrmc-deploy-$RELEASE_SHA.sh; RELEASE_SHA=$RELEASE_SHA bash /tmp/trackmyrmc-deploy-$RELEASE_SHA.sh"
          PARAMS="$(jq -cn --arg cmd "$REMOTE" '{commands:[$cmd]}')"
          COMMAND_ID="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "TrackMyRMC gated release $RELEASE_SHA" --parameters "$PARAMS" \
            --query 'Command.CommandId' --output text)"
          for attempt in $(seq 1 60); do
            status="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed. The server-side application rollback trap was invoked."
                exit 1 ;;
            esac
            sleep 5
          done
          echo "Deployment timed out; inspect the instance before any retry." >&2
          exit 1

      - name: Verify public HTTPS, API, and web assets
        id: public_smoke
        run: |
          set -euo pipefail
          curl --retry 10 --retry-all-errors --retry-delay 3 -fsS https://trackmyrmc.com/health
          curl --retry 10 --retry-all-errors --retry-delay 3 -fsS https://trackmyrmc.com/ | grep -F '_expo/static/' >/dev/null
          curl --retry 10 --retry-all-errors --retry-delay 3 -fsSI https://trackmyrmc.com/ | grep -Eiq '^HTTP/[^ ]+ 200'
          ADMIN_JS="$(curl --retry 10 --retry-all-errors --retry-delay 3 -fsS https://trackmyrmc.com/admin/ | grep -Eo 'src="/admin/assets/[^"]+\.js"' | head -n 1 | cut -d '"' -f 2)"
          test -n "$ADMIN_JS"
          curl --retry 10 --retry-all-errors --retry-delay 3 -fsSI "https://trackmyrmc.com$ADMIN_JS" | grep -Eiq '^HTTP/[^ ]+ 200'

      - name: Restore previous application after public smoke failure
        if: ${{ failure() && steps.deploy_release.outcome == 'success' && steps.public_smoke.outcome == 'failure' }}
        run: |
          set -euo pipefail
          REMOTE="set -eu; curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$RELEASE_SHA/ops/aws-rollback-ec2.sh -o /tmp/trackmyrmc-rollback-$RELEASE_SHA.sh; RELEASE_SHA=$RELEASE_SHA bash /tmp/trackmyrmc-rollback-$RELEASE_SHA.sh"
          PARAMS="$(jq -cn --arg cmd "$REMOTE" '{commands:[$cmd]}')"
          COMMAND_ID="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "TrackMyRMC failed external smoke rollback $RELEASE_SHA" --parameters "$PARAMS" \
            --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          echo "Previous application rollback command completed; investigate database compatibility and HTTPS."
