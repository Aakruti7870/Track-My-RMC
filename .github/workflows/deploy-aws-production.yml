name: Deploy TrackMyRMC AWS Production

# Automatic production deployment:
# - Triggered by completion of Backend CI or Frontend CI
# - Requires both workflows to pass for the exact same main commit
# - Does not authorize database cutover
# - Deploys only a SHA-pinned release

on:
  workflow_run:
    # One release gate per SHA; it waits for Frontend CI as well.
    workflows:
      - "Backend CI"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: trackmyrmc-aws-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::260234292958:role/TrackMyRMC-GitHubDeploy
  ARTIFACT_BUCKET: trackmyrmc-prod-artifacts-260234292958-ap-south-1
  INSTANCE_ID: i-0598aad6e6d729c69
  APP_SECRET_NAME: trackmyrmc/app-runtime
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  deploy:
    name: Verify, Build and Deploy to AWS
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trackmyrmc_user
          POSTGRES_PASSWORD: securepassword
          POSTGRES_DB: trackmyrmc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Verify both CI workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "Release commit: $RELEASE_SHA"

          MAIN_SHA="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/main" \
            --jq '.sha')"

          if [ "$MAIN_SHA" != "$RELEASE_SHA" ]; then
            echo "Release commit is not current main."
            exit 1
          fi

          # Display names match workflow_run; resolve immutable IDs via the API.
          # A CI workflow MUST have an actual successful push run for this main SHA.
          for wf_name in "Backend CI" "Frontend CI"; do
            echo "Checking required workflow: $wf_name"

            workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" |
              jq -er --arg name "$wf_name" '
                [.workflows[] | select(.name == $name and .state == "active") | .id]
                | if length == 1 then .[0] else error("Expected exactly one active workflow named " + $name) end
              ')"

            passed=false
            for attempt in $(seq 1 45); do
              response="$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?event=push&branch=main&head_sha=${RELEASE_SHA}&per_page=100")"

              status="$(printf '%s' "$response" | jq -r \
                --arg sha "$RELEASE_SHA" '
                  [
                    .workflow_runs[]
                    | select(.head_sha == $sha and .event == "push" and .head_branch == "main")
                  ]
                  | sort_by(.run_number, .run_attempt)
                  | last
                  | if . == null then
                      "missing"
                    else
                      (.status + ":" + (.conclusion // ""))
                    end
                ')"

              echo "${wf_name} (${workflow_id}): $status"
              if [ "$status" = "completed:success" ]; then
                passed=true
                break
              fi
              if [[ "$status" == completed:* ]]; then
                echo "Required workflow ${wf_name} completed unsuccessfully."
                exit 1
              fi
              sleep 20
            done

            if [ "$passed" != true ]; then
              echo "${wf_name} did not pass for release SHA ${RELEASE_SHA}."
              exit 1
            fi
          done

          MAIN_SHA="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/main" \
            --jq '.sha')"

          test "$MAIN_SHA" = "$RELEASE_SHA"

          echo "Both required CI workflows passed."

      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu

      - name: Validate deployment script
        run: |
          set -euo pipefail
          bash -n ops/aws-deploy-ec2.sh

      - name: Rust formatting
        working-directory: backend
        run: cargo fmt --all -- --check

      - name: Rust check
        run: cargo check --all-targets --manifest-path backend/Cargo.toml

      - name: Rust clippy
        run: cargo clippy --all-targets --manifest-path backend/Cargo.toml -- -D warnings

      - name: Rust tests
        env:
          DATABASE_URL: postgres://trackmyrmc_user:securepassword@localhost:5432/trackmyrmc_test
          JWT_SECRET: test_jwt_secret_key_at_least_32_characters_long
          APP_ENV: test
        run: cargo test --manifest-path backend/Cargo.toml --verbose

      - name: Build Rust backend
        run: cargo build --release --manifest-path backend/Cargo.toml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Load production runtime secrets from AWS Secrets Manager
        run: |
          set -euo pipefail

          ACCOUNT="$(aws sts get-caller-identity \
            --query Account --output text)"
          test "$ACCOUNT" = "260234292958"

          SECRET_ARN="$(aws secretsmanager describe-secret \
            --secret-id "${APP_SECRET_NAME}" \
            --region "${AWS_REGION}" \
            --query ARN \
            --output text 2>/dev/null || echo "${APP_SECRET_NAME}")"

          SECRET_JSON="$(aws secretsmanager get-secret-value \
            --secret-id "${SECRET_ARN}" \
            --region "${AWS_REGION}" \
            --query SecretString \
            --output text)"

          TRACKMYRMC_SECRET_JSON="${SECRET_JSON}" python3 - <<'PY'
          import json, os, sys

          secret_raw = os.environ.get("TRACKMYRMC_SECRET_JSON", "")
          try:
              secret = json.loads(secret_raw)
          except Exception as e:
              sys.exit(f"Failed to parse secret JSON: {e}")

          expo_maps_key = (secret.get("EXPO_PUBLIC_GOOGLE_MAPS_KEY") or "").strip()
          android_maps_key = (secret.get("GOOGLE_MAPS_ANDROID_KEY") or "").strip()
          places_key = (secret.get("GOOGLE_PLACES_API_KEY") or "").strip()

          # Mask secrets immediately so GitHub Actions redacts any appearance in logs
          for val in (expo_maps_key, android_maps_key, places_key):
              if val:
                  print(f"::add-mask::{val}")

          # Validate all three Google Maps keys are nonempty without printing their values
          missing = []
          if not expo_maps_key:
              missing.append("EXPO_PUBLIC_GOOGLE_MAPS_KEY")
          if not android_maps_key:
              missing.append("GOOGLE_MAPS_ANDROID_KEY")
          if not places_key:
              missing.append("GOOGLE_PLACES_API_KEY")

          if missing:
              sys.exit(f"Validation failed: Google Maps keys missing or empty: {', '.join(missing)}")

          github_env = os.environ.get("GITHUB_ENV")
          if github_env:
              with open(github_env, "a", encoding="utf-8") as f:
                  f.write(f"EXPO_PUBLIC_GOOGLE_MAPS_KEY={expo_maps_key}\n")
                  f.write(f"GOOGLE_MAPS_ANDROID_KEY={android_maps_key}\n")
                  f.write(f"GOOGLE_PLACES_API_KEY={places_key}\n")

          print("Production runtime keys loaded, masked, and validated.")
          PY
          unset SECRET_JSON TRACKMYRMC_SECRET_JSON

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Expo web
        working-directory: frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: https://trackmyrmc.com
          EXPO_PUBLIC_GOOGLE_MAPS_KEY: ${{ env.EXPO_PUBLIC_GOOGLE_MAPS_KEY }}
          GOOGLE_MAPS_ANDROID_KEY: ${{ env.GOOGLE_MAPS_ANDROID_KEY }}
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run check:auth-routing
          npm run check:android-layout
          npm run build:preview
          test -s dist/index.html

      - name: Build admin dashboard
        working-directory: admin-web
        env:
          VITE_API_URL: https://trackmyrmc.com
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -s dist/index.html

      - name: Package release artifacts
        run: |
          set -euo pipefail

          git archive \
            --format=tar.gz \
            --output="/tmp/source-${RELEASE_SHA}.tgz" \
            "${RELEASE_SHA}"

          tar -C admin-web/dist \
            -czf "/tmp/admin-web-${RELEASE_SHA}.tgz" .

          tar -C frontend \
            -czf "/tmp/frontend-${RELEASE_SHA}.tgz" dist

          test -s "/tmp/source-${RELEASE_SHA}.tgz"
          test -s "/tmp/admin-web-${RELEASE_SHA}.tgz"
          test -s "/tmp/frontend-${RELEASE_SHA}.tgz"
          test -s backend/target/release/trackmyrmc-backend

      - name: Upload release artifacts to S3
        run: |
          set -euo pipefail

          aws s3 cp \
            backend/target/release/trackmyrmc-backend \
            "s3://${ARTIFACT_BUCKET}/backend-${RELEASE_SHA}"

          aws s3 cp \
            "/tmp/frontend-${RELEASE_SHA}.tgz" \
            "s3://${ARTIFACT_BUCKET}/frontend-${RELEASE_SHA}.tgz"

          aws s3 cp \
            "/tmp/source-${RELEASE_SHA}.tgz" \
            "s3://${ARTIFACT_BUCKET}/source-${RELEASE_SHA}.tgz"

          aws s3 cp \
            "/tmp/admin-web-${RELEASE_SHA}.tgz" \
            "s3://${ARTIFACT_BUCKET}/admin-web-${RELEASE_SHA}.tgz"

          echo "Release artifacts uploaded."

      - name: Upload deployment script to S3 (safer than raw.githubusercontent)
        run: |
          set -euo pipefail
          aws s3 cp ops/aws-deploy-ec2.sh "s3://${ARTIFACT_BUCKET}/ops/aws-deploy-ec2-${RELEASE_SHA}.sh"
          echo "Deployment script uploaded to s3://${ARTIFACT_BUCKET}/ops/aws-deploy-ec2-${RELEASE_SHA}.sh"

      - name: Recheck main before production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          MAIN_SHA="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/main" \
            --jq '.sha')"

          test "$MAIN_SHA" = "$RELEASE_SHA" || {
            echo "Main changed during build. Refusing stale deployment."
            exit 1
          }

      - name: Deploy EC2 through AWS SSM
        run: |
          set -euo pipefail

          # Use the S3-hosted deploy script via deploy-cache so the instance doesn't need GitHub raw access.
          REMOTE_COMMAND="set -euo pipefail; mkdir -p /opt/trackmyrmc/deploy-cache && aws s3 cp s3://${ARTIFACT_BUCKET}/ops/aws-deploy-ec2-${RELEASE_SHA}.sh /opt/trackmyrmc/deploy-cache/trackmyrmc-deploy-${RELEASE_SHA}.sh && bash -n /opt/trackmyrmc/deploy-cache/trackmyrmc-deploy-${RELEASE_SHA}.sh && RELEASE_SHA='${RELEASE_SHA}' bash /opt/trackmyrmc/deploy-cache/trackmyrmc-deploy-${RELEASE_SHA}.sh && rm -f /opt/trackmyrmc/deploy-cache/trackmyrmc-deploy-${RELEASE_SHA}.sh"

          PARAMS="$(jq -nc \
            --arg command "$REMOTE_COMMAND" \
            '{commands: [$command]}')"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "TrackMyRMC production deploy ${RELEASE_SHA}" \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM Command ID: $COMMAND_ID"

          # Wait but don't let 'wait' hide the remote logs; continue to fetch invocation regardless.
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            || true

          # Fetch the detailed invocation JSON (includes stdout/stderr)
          INVOCATION_JSON="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --output json || true)"

          echo "=== SSM invocation JSON ==="
          printf '%s\n' "$INVOCATION_JSON"

          echo "=== SSM Stdout ==="
          printf '%s\n' "$INVOCATION_JSON" | jq -r '.StandardOutputContent // "<no stdout>"'

          echo "=== SSM Stderr ===" >&2
          printf '%s\n' "$INVOCATION_JSON" | jq -r '.StandardErrorContent // "<no stderr>"' >&2

          STATUS="$(printf '%s\n' "$INVOCATION_JSON" | jq -r '.Status // "Unknown"')"

          if [ "$STATUS" != "Success" ]; then
            echo "AWS deployment failed: $STATUS"
            exit 1
          fi

          echo "SSM deployment completed."

      - name: Verify public production health
        run: |
          set -euo pipefail

          BASE_URL="https://trackmyrmc.com"

          curl \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 3 \
            -fsS "${BASE_URL}/health"

          curl \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 3 \
            -fsS "${BASE_URL}/" \
            | grep -F '_expo/static/' >/dev/null

          curl \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 3 \
            -fsSI "${BASE_URL}/" \
            | grep -Eiq '^HTTP/[^ ]+ 200'

          ADMIN_HTML="$(curl \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 3 \
            -fsS "${BASE_URL}/admin/")"

          ADMIN_JS="$(printf '%s' "$ADMIN_HTML" \
            | grep -Eo 'src="/admin/assets/[^"]+\.js"' \
            | head -n 1 \
            | cut -d '"' -f 2)"

          test -n "$ADMIN_JS"

          curl \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 3 \
            -fsSI "${BASE_URL}${ADMIN_JS}" \
            | grep -Eiq '^HTTP/[^ ]+ 200'

          echo "Production health checks passed."

      - name: Deployment summary
        if: success()
        run: |
          echo "## TrackMyRMC AWS Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${RELEASE_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: main" >> "$GITHUB_STEP_SUMMARY"
          echo "- AWS region: ${AWS_REGION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Instance: ${INSTANCE_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://trackmyrmc.com" >> "$GITHUB_STEP_SUMMARY"
