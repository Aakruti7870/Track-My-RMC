name: Temporary Rust lockfile refresh for PR 161

# Restricted to one branch; delete this workflow after the lockfile commit.
on:
  push:
    branches: [security/dependency-and-production-preflight-20261108]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'Aakruti7870/Track-My-RMC' && github.event.head_commit.message != 'refresh-rust-lock'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: security/dependency-and-production-preflight-20261108
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Resolve patched Tokio and selected JWT provider
        run: |
          set -euo pipefail
          cd backend
          cargo update -p tokio --precise 1.54.1
          cargo metadata --format-version 1 --locked > /dev/null
          cd ..
          git diff --check
          git status --short
      - name: Commit only generated Cargo.lock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/Cargo.lock; then
            echo "No lockfile diff."
            exit 0
          fi
          unexpected="$(git diff --name-only | grep -v '^backend/Cargo.lock$' || true)"
          test -z "$unexpected" || { echo "Unexpected tracked changes."; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- backend/Cargo.lock
          git commit -m 'refresh-rust-lock'
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" \
            push origin HEAD:refs/heads/security/dependency-and-production-preflight-20261108
