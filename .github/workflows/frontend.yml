name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      # Production gate requires both workflows on the same release SHA.
      # Backend-only changes must trigger Frontend CI too.
      - "backend/**"
      - "frontend/**"
      - "admin-web/**"
      - "ops/**"
      - "docs/security/**"
      - ".github/workflows/frontend.yml"
      - ".github/workflows/android-build.yml"
      - ".github/workflows/deploy-aws-production.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Validate production shell scripts before merge
        run: |
          bash -n ../ops/aws-deploy-ec2.sh
          bash -n ../ops/verify-production-health.sh
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm ci
      - name: Type Check
        run: npm run typecheck
      - name: Permission consent race and notification registration regressions
        run: node --test scripts/test-permission-consent.cjs
      - name: Validate custom operational notification sound assets and channels
        run: node --test scripts/test-custom-notification-sounds.cjs
      - name: API base path regressions
        run: npm run test:api-base
      - name: Image parser security and Metro asset compatibility
        run: node --test scripts/test-image-size.cjs
      - name: Validate uploaded PNG splash, native startup and removed video
        run: node --test scripts/test-splash-image.cjs
      - name: Validate optimized WebP graphics, loading priority and native splash safeguards
        run: node --test scripts/test-optimized-images.cjs
      - name: Validate light and dark login hero assets and layout
        run: node --test scripts/test-login-banners.cjs
      - name: Home tracking state regressions
        run: node --test scripts/test-home-tracking.cjs
      - name: Google Maps loader regressions
        run: npm run test:maps
      - name: KYC provider availability guard
        run: npm run check:kyc-availability
      - name: Customer header foreground location regressions
        run: node --test scripts/test-header-location.cjs
      - name: Verify isolated Google Play reviewer MFA routing
        run: node --test scripts/test-play-review-mfa-routing.cjs
      - name: Validate role routing
        run: npm run check:auth-routing
      - name: Validate all role module routes and menus
        run: npm run check:modules
      - name: Validate unique owner/staff module placement and responsive card sizes
        run: node scripts/test-owner-staff-module-layout.cjs
      - name: Validate every uploaded vector symbol and role assignment
        run: npm run check:vector-symbols
      - name: Enforce one font family across the Expo application
        run: npm run check:single-font
      - name: Validate Google Play privacy and permission readiness
        run: npm run check:android-permissions
      - name: Validate Play review, account deletion, and App Links contracts
        run: npm run check:play-policy
      - name: Validate Android responsive layouts
        run: npm run check:android-layout
      - name: Validate theme readability and bottom navigation geometry
        run: node --test scripts/test-theme-legibility.cjs
      - name: Expo Doctor
        run: npm run doctor
      - name: Verify generated Android Maps manifest with a test-only key
        env:
          GOOGLE_MAPS_ANDROID_KEY: "test-only-android-maps-key-do-not-deploy"
        run: |
          npx expo prebuild --platform android --clean --no-install
          node scripts/check-android-maps-manifest.cjs
      - name: Build production web bundle
        env:
          EXPO_PUBLIC_BACKEND_URL: https://trackmyrmc.com
        run: npm run build:preview
      - name: Install browser test dependencies
        run: |
          npm ci --prefix ../admin-web
          node ../admin-web/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify Customer Home at mobile and desktop widths
        run: |
          python3 -m http.server 8765 --directory dist > /tmp/home-preview-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node scripts/test-home-tracking-browser.cjs
          node scripts/test-customer-header-browser.cjs
          node scripts/test-owner-dashboard-browser.cjs
          node scripts/test-staff-dashboard-browser.cjs
      - name: Upload tracking layout previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-home-tracking-previews
          path: frontend/tracking-previews/
      - name: Upload customer header theme previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-header-theme-previews
          path: frontend/header-previews/

      - name: Upload staff workspace preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staff-role-dashboard-previews
          path: frontend/staff-previews/
      - name: Upload owner dashboard theme previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-dashboard-theme-previews
          path: frontend/owner-previews/

  admin-web-build:
    # PR #191 modifies mobile and Rust only. Keep the complete web check on
    # main and on every other pull request, including admin-facing PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.number != 191
    name: Admin dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm ci
      - name: Build Admin Dashboard
        env:
          VITE_API_URL: https://trackmyrmc.com
        run: npm run build
      - name: Verify offline authenticator QR and prevent key exfiltration
        run: npm run test:qr
      - name: Install Chromium for admin workspace regressions
        run: npx playwright install --with-deps chromium
      - name: Verify admin loading, failure and sign-out isolation
        run: npm run test:browser
