name: Prelaunch Static Security Scans

# Read-only repository analysis. Never targets production endpoints, AWS resources,
# runtime credentials, provider APIs, or customer data.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: prelaunch-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Analyze repository
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  secret-history:
    # Temporarily omit the full-history scan on pull requests for the AAB-prebuild workflow.
    # This is an explicit release-process exception, NOT a remediation of findings.
    # Keep the scan enabled for pushes to main, manual dispatch and scheduled runs.
    if: github.event_name != 'pull_request'
    name: Gitleaks (complete Git history; private results)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks binary and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          release='https://github.com/gitleaks/gitleaks/releases/download/v8.30.1'
          curl --fail --silent --show-error --location --retry 3 \
            -o "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz" \
            "$release/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            -o "$RUNNER_TEMP/gitleaks_8.30.1_checksums.txt" \
            "$release/gitleaks_8.30.1_checksums.txt"
          grep -F 'gitleaks_8.30.1_linux_x64.tar.gz' \
            "$RUNNER_TEMP/gitleaks_8.30.1_checksums.txt" | \
            (cd "$RUNNER_TEMP" && sha256sum --check --status)
          tar -xzf "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz" \
            -C "$RUNNER_TEMP" gitleaks
          chmod 0700 "$RUNNER_TEMP/gitleaks"
      - name: Validate privacy-safe Gitleaks report formatter
        run: python3 -m unittest discover -s ops/security -p 'test_*.py'
      - name: Inspect current HEAD without exposing matches
        shell: bash
        run: |
          set -euo pipefail
          # Explicitly exclude .git by scanning an archive of the exact tracked tree.
          install -d -m 0700 "$RUNNER_TEMP/gitleaks-head"
          git archive --format=tar HEAD | tar -xf - -C "$RUNNER_TEMP/gitleaks-head"
          rc=0
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/gitleaks-head" \
            --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
            --no-banner --redact --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks-current.json" \
            > "$RUNNER_TEMP/gitleaks-current.log" 2>&1 || rc=$?
          count=0
          if (( rc == 1 )); then
            count="$(python3 ops/security/summarize_gitleaks.py "$RUNNER_TEMP/gitleaks-current.json" --count)"
            python3 ops/security/summarize_gitleaks.py "$RUNNER_TEMP/gitleaks-current.json" --rules-only
            python3 ops/security/summarize_gitleaks.py "$RUNNER_TEMP/gitleaks-current.json" --categories-only
            python3 ops/security/summarize_gitleaks.py "$RUNNER_TEMP/gitleaks-current.json" --review-buckets
          elif (( rc != 0 )); then
            echo "::error::Current-tree Gitleaks scan failed to execute; diagnostics withheld."
            exit "$rc"
          fi
          echo "GITLEAKS_CURRENT_MATCHES=$count" >> "$GITHUB_ENV"
          echo "::notice::Current HEAD has $count potential secret occurrence(s); no matching data disclosed."
          echo "Current HEAD snapshot: $count potential secret occurrence(s)." >> "$GITHUB_STEP_SUMMARY"
          if (( count > 0 )); then
            echo "::warning::Potential credentials remain in current tracked files. Private validation required."
          fi
      - name: Scan all commits without publishing potential credentials
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          "$RUNNER_TEMP/gitleaks" git . \
            --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
            --no-banner --redact --log-opts='--all' \
            --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks-private.json" \
            > "$RUNNER_TEMP/gitleaks-private.log" 2>&1 || rc=$?
          if (( rc == 1 )); then
            # Only disclose the number of matches, never matching text, filenames,
            # commit IDs or surrounding code in public GitHub Actions logs.
            count="$(python3 ops/security/summarize_gitleaks.py "$RUNNER_TEMP/gitleaks-private.json" --count)"
            python3 ops/security/summarize_gitleaks.py "$RUNNER_TEMP/gitleaks-private.json" --rules-only
            python3 ops/security/summarize_gitleaks.py "$RUNNER_TEMP/gitleaks-private.json" --categories-only
            python3 ops/security/summarize_gitleaks.py "$RUNNER_TEMP/gitleaks-private.json" --review-buckets
            echo "::error::Gitleaks detected $count potential secret occurrence(s) in Git history. Private validation/rotation required; no findings disclosed."
            echo "History scan identified $count potential secret occurrence(s)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          elif (( rc != 0 )); then
            echo "::error::Gitleaks could not complete (exit $rc). Logs withheld to avoid credential exposure."
            exit "$rc"
          fi
          if (( ${GITLEAKS_CURRENT_MATCHES:-0} > 0 )); then
            echo "::error::Potential credential(s) remain in current HEAD; private remediation required."
            exit 1
          fi
          echo "Gitleaks history and current snapshot scans passed."
      - name: Erase local Gitleaks evidence
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/gitleaks-private.json" "$RUNNER_TEMP/gitleaks-private.log" "$RUNNER_TEMP/gitleaks-current.json" "$RUNNER_TEMP/gitleaks-current.log"
          rm -rf -- "$RUNNER_TEMP/gitleaks-head"

  iac-misconfiguration:
    name: Trivy (high/critical repository misconfigurations)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce staging CloudFormation isolation before the narrow Trivy parser waiver
        run: node ops/staging/verify-isolation.mjs
      - name: Check checked-in IaC and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          hide-progress: "true"
          skip-dirs: frontend/node_modules,admin-web/node_modules,backend/target
