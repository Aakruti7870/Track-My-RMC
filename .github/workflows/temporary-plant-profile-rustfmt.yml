name: Format Plant Profile Rust (branch only)
on:
  push:
    branches:
      - feat/plant-profile-rust-six-cards
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/plant-profile-rust-six-cards
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt and commit changes only if necessary
        working-directory: backend
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/routes/plant_profile.rs src/routes/mod.rs
            git commit -m "style(plant-profile): apply cargo fmt"
            git push origin HEAD:feat/plant-profile-rust-six-cards
          fi
