name: Android Build Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/android-build.yml"

jobs:
  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Prebuild Android
        env:
          EXPO_PUBLIC_API_URL: https://trackmyrmc-backend.onrender.com
        run: npx expo prebuild --platform android --non-interactive

      - name: Build release AAB
        working-directory: frontend/android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: trackmyrmc-android-release-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
