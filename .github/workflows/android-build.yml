name: Android Signed Release AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-build.yml"
    tags:
      - "android-v*"
  # A reviewed release-workflow change on main deliberately requests a signed
  # candidate, without granting signing secrets to pull requests. Ordinary app
  # merges do not trigger this build. Tags and manual dispatch remain available.

permissions:
  contents: read
  id-token: write

env:
  CI: "1"
  EXPO_PUBLIC_BACKEND_URL: https://trackmyrmc.com
  EXPECTED_PLAY_UPLOAD_SHA1: "3D:5F:80:59:1C:BA:69:1B:03:28:4D:A1:74:91:38:1D:8F:A1:32:DC"
  # Populate only after comparing against the Play Console UPLOAD certificate.
  # The Play App Signing certificate and the AAB file checksum are not substitutes.
  EXPECTED_PLAY_UPLOAD_SHA256: ${{ vars.TRACKMYRMC_PLAY_UPLOAD_SHA256 }}
  PACKAGE_NAME: com.trackmyrmc.concreteking
  VERSION_CODE: "95"
  VERSION_NAME: "2.0.35"
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::260234292958:role/TrackMyRMC-GitHubDeploy
  APP_SECRET_NAME: trackmyrmc/app-runtime

jobs:
  android-build:
    name: Build and verify signed release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify production backend
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS "$EXPO_PUBLIC_BACKEND_URL/health" >/tmp/health.json
          grep -F '"status":"ok"' /tmp/health.json >/dev/null

      - name: Verify required signing secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || missing+=(ANDROID_KEYSTORE_BASE64)
          [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [ -n "${{ secrets.ANDROID_STORE_PASSWORD }}" ] || missing+=(ANDROID_STORE_PASSWORD)
          [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ] || missing+=(ANDROID_KEY_ALIAS)
          if [[ ! "$EXPECTED_PLAY_UPLOAD_SHA256" =~ ^([[:xdigit:]]{2}:){31}[[:xdigit:]]{2}$ ]]; then
            echo "Set TRACKMYRMC_PLAY_UPLOAD_SHA256 to the independently verified Google Play upload-certificate SHA-256 (colon-separated)."
            exit 1
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required signing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and validate role modules before Android packaging
        run: |
          npm run typecheck
          npm run check:auth-routing
          npm run check:modules
          npm run check:android-layout

      - name: Validate Google Play privacy and permission readiness
        run: |
          npm run check:android-permissions
          npm run check:play-policy
          node scripts/check-fresh-production-release.mjs

      - name: Verify Firebase Android configuration
        run: |
          set -euo pipefail
          test -s google-services.json
          node -e "const c=require('./google-services.json'); const a=c.client?.find(x=>x.client_info?.android_client_info?.package_name===process.env.PACKAGE_NAME); if(!a || !a.api_key?.some(x=>/^AIza[\w-]{35}$/.test(x.current_key||'')) || !c.project_info?.project_id || !a.client_info?.mobilesdk_app_id){ console.error('Firebase Android release config incomplete'); process.exit(1); } console.log('Firebase Android config verified')"

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      - name: Load Google Maps keys from AWS Secrets Manager
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Least-privilege & PR isolation: verify identity only if role was assumed
            ACCOUNT="$(aws sts get-caller-identity --query Account --output text 2>/dev/null || echo "")"
            if [ -z "$ACCOUNT" ]; then
              echo "Pull request build: AWS credentials not available or role not assumed; skipping secret loading to avoid exposing keys in PR."
              exit 0
            fi
            if [ "$ACCOUNT" != "260234292958" ]; then
              echo "Pull request build: unexpected AWS account $ACCOUNT; skipping to avoid exposing keys."
              exit 0
            fi
          else
            ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
            test "$ACCOUNT" = "260234292958"
          fi

          SECRET_ARN="$(aws secretsmanager describe-secret \
            --secret-id "${APP_SECRET_NAME}" \
            --region "${AWS_REGION}" \
            --query ARN \
            --output text 2>/dev/null || echo "${APP_SECRET_NAME}")"

          SECRET_JSON="$(aws secretsmanager get-secret-value \
            --secret-id "${SECRET_ARN}" \
            --region "${AWS_REGION}" \
            --query SecretString \
            --output text)"

          TRACKMYRMC_SECRET_JSON="${SECRET_JSON}" python3 - <<'PY'
          import json, os, sys

          secret_raw = os.environ.get("TRACKMYRMC_SECRET_JSON", "")
          try:
              secret = json.loads(secret_raw)
          except Exception as e:
              sys.exit(f"Failed to parse secret JSON: {e}")

          expo_maps_key = (secret.get("EXPO_PUBLIC_GOOGLE_MAPS_KEY") or "").strip()
          android_maps_key = (secret.get("GOOGLE_MAPS_ANDROID_KEY") or "").strip()
          places_key = (secret.get("GOOGLE_PLACES_API_KEY") or "").strip()

          # Always mask keys immediately in GitHub Actions runner logs
          for val in (expo_maps_key, android_maps_key, places_key):
              if val:
                  print(f"::add-mask::{val}")

          # Validate all three Google Maps keys are nonempty without printing their values
          missing = []
          if not expo_maps_key:
              missing.append("EXPO_PUBLIC_GOOGLE_MAPS_KEY")
          if not android_maps_key:
              missing.append("GOOGLE_MAPS_ANDROID_KEY")
          if not places_key:
              missing.append("GOOGLE_PLACES_API_KEY")

          if missing:
              sys.exit(f"Validation failed: Google Maps keys missing or empty: {', '.join(missing)}")

          github_env = os.environ.get("GITHUB_ENV")
          if github_env:
              with open(github_env, "a", encoding="utf-8") as f:
                  f.write(f"EXPO_PUBLIC_GOOGLE_MAPS_KEY={expo_maps_key}\n")
                  f.write(f"GOOGLE_MAPS_ANDROID_KEY={android_maps_key}\n")
                  f.write(f"GOOGLE_PLACES_API_KEY={places_key}\n")

          print("Google Maps runtime configuration loaded, masked, and validated.")
          PY
          unset SECRET_JSON TRACKMYRMC_SECRET_JSON

      - name: Generate Android project
        env:
          GOOGLE_MAPS_ANDROID_KEY: ${{ env.GOOGLE_MAPS_ANDROID_KEY }}
          EXPO_PUBLIC_GOOGLE_MAPS_KEY: ${{ env.EXPO_PUBLIC_GOOGLE_MAPS_KEY }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify Android Maps SDK manifest configuration
        env:
          GOOGLE_MAPS_ANDROID_KEY: ${{ env.GOOGLE_MAPS_ANDROID_KEY }}
        run: node scripts/check-android-maps-manifest.cjs

      - name: Verify release version
        run: |
          set -euo pipefail
          grep -Fq "versionCode ${VERSION_CODE}" android/app/build.gradle
          node -e "const app=require('./app.json').expo; if(app.version !== process.env.VERSION_NAME || app.android.versionCode !== Number(process.env.VERSION_CODE)) process.exit(1); console.log('Android release version verified')"

      - name: Restore upload keystore
        working-directory: frontend/android/app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > upload-keystore.jks
          test -s upload-keystore.jks

      - name: Verify upload certificate
        working-directory: frontend/android/app
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          info="$(keytool -list -v -keystore upload-keystore.jks -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" 2>/dev/null)"
          sha1="$(printf '%s\n' "$info" | awk -F'SHA1: ' '/SHA1:/{print $2; exit}' | tr -d '\r')"
          sha256="$(printf '%s\n' "$info" | awk -F'SHA256: ' '/SHA256:/{print $2; exit}' | tr -d '\r')"
          test "$sha1" = "$EXPECTED_PLAY_UPLOAD_SHA1"
          test "${sha256^^}" = "${EXPECTED_PLAY_UPLOAD_SHA256^^}"
          echo "Upload certificate SHA1 verified: $sha1"
          echo "Upload certificate SHA256 verified: $sha256"

      - name: Detect private-key password
        working-directory: frontend/android/app
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          rm -rf /tmp/keycheck && mkdir -p /tmp/keycheck
          printf 'probe\n' >/tmp/keycheck/probe.txt
          (cd /tmp/keycheck && jar --create --file probe.jar probe.txt)
          if jarsigner -keystore upload-keystore.jks -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" /tmp/keycheck/probe.jar "$KEY_ALIAS" >/dev/null 2>&1; then
            echo KEY_PASSWORD_MODE=primary >> "$GITHUB_ENV"
          else
            rm -f /tmp/keycheck/probe.jar
            (cd /tmp/keycheck && jar --create --file probe.jar probe.txt)
            jarsigner -keystore upload-keystore.jks -storepass "$STORE_PASSWORD" -keypass "$STORE_PASSWORD" /tmp/keycheck/probe.jar "$KEY_ALIAS" >/dev/null 2>&1
            echo KEY_PASSWORD_MODE=store >> "$GITHUB_ENV"
          fi

      - name: Build unsigned release AAB
        working-directory: frontend/android
        env:
          GOOGLE_MAPS_ANDROID_KEY: ${{ env.GOOGLE_MAPS_ANDROID_KEY }}
          EXPO_PUBLIC_GOOGLE_MAPS_KEY: ${{ env.EXPO_PUBLIC_GOOGLE_MAPS_KEY }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text()
          start=s.find('release {')
          marker='signingConfig signingConfigs.debug'
          pos=s.find(marker,start)
          if start < 0 or pos < 0:
              raise SystemExit('release debug signingConfig not found')
          p.write_text(s[:pos]+s[pos+len(marker):])
          PY
          ./gradlew :app:bundleRelease --no-daemon
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Verify merged release manifest permissions
        working-directory: frontend/android
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifests = list(Path("app/build/intermediates/merged_manifests/release").rglob("AndroidManifest.xml"))
          if len(manifests) != 1:
              raise SystemExit("Expected exactly one merged Android release manifest")
          manifest = ET.parse(manifests[0]).getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          if manifest.get("package") != os.environ["PACKAGE_NAME"]:
              raise SystemExit("Merged manifest application ID mismatch")
          if (manifest.get(android + "versionCode") != os.environ["VERSION_CODE"]
              or manifest.get(android + "versionName") != os.environ["VERSION_NAME"]):
              raise SystemExit("Merged manifest Android version mismatch")
          permissions = {element.get(android + "name") for element in manifest
                         if element.tag in ("uses-permission", "uses-permission-sdk-23")}
          config = json.loads(Path("../app.json").read_text())["expo"]["android"]
          unexpected = permissions.intersection(config["blockedPermissions"])
          missing = {f"android.permission.{name}" for name in config["permissions"]} - permissions
          if unexpected or missing:
              raise SystemExit(f"Release manifest permissions: unexpected={sorted(unexpected)} missing={sorted(missing)}")
          print("Merged release manifest identity and permissions verified")
          PY

      - name: Sign AAB with verified upload key
        working-directory: frontend/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          aab=app/build/outputs/bundle/release/app-release.aab
          if [ "$KEY_PASSWORD_MODE" = primary ]; then keypass="$KEY_PASSWORD"; else keypass="$STORE_PASSWORD"; fi
          jarsigner -keystore app/upload-keystore.jks -storetype JKS -storepass "$STORE_PASSWORD" -keypass "$keypass" "$aab" "$KEY_ALIAS"
          jarsigner -verify -verbose -certs "$aab"

      - name: Validate final AAB
        working-directory: frontend/android
        run: |
          set -euo pipefail
          aab=app/build/outputs/bundle/release/app-release.aab
          signer="$(keytool -printcert -jarfile "$aab" 2>/dev/null)"
          sha1="$(printf '%s\n' "$signer" | awk -F'SHA1: ' '/SHA1:/{print $2; exit}' | tr -d '\r')"
          sha256="$(printf '%s\n' "$signer" | awk -F'SHA256: ' '/SHA256:/{print $2; exit}' | tr -d '\r')"
          test "$sha1" = "$EXPECTED_PLAY_UPLOAD_SHA1"
          test "${sha256^^}" = "${EXPECTED_PLAY_UPLOAD_SHA256^^}"
          echo "Final AAB signer SHA1 verified: $sha1"
          echo "Final AAB signer SHA256 verified: $sha256"
          echo "AAB_SHA256=$(sha256sum "$aab" | awk '{print $1}')"

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: trackmyrmc-v2.0.35-vc95-signed-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      # APK for direct-device smoke testing only. AAB remains the Play upload file.
      # Play App Signing may use a different certificate, so do not treat this
      # upload-key-signed APK as an in-place update to a Play-installed build.
      - name: Build unsigned release APK
        working-directory: frontend/android
        env:
          GOOGLE_MAPS_ANDROID_KEY: ${{ env.GOOGLE_MAPS_ANDROID_KEY }}
          EXPO_PUBLIC_GOOGLE_MAPS_KEY: ${{ env.EXPO_PUBLIC_GOOGLE_MAPS_KEY }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Zipalign, sign and validate test APK
        working-directory: frontend/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -d "$sdk/build-tools"
          build_tools="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$build_tools/zipalign"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/aapt"
          unsigned=app/build/outputs/apk/release/app-release-unsigned.apk
          aligned="$RUNNER_TEMP/trackmyrmc-release-aligned.apk"
          signed=app/build/outputs/apk/release/trackmyrmc-v2.0.35-vc95-signed.apk
          "$build_tools/zipalign" -P 16 -f 4 "$unsigned" "$aligned"
          if [ "$KEY_PASSWORD_MODE" = primary ]; then
            keypass="$KEY_PASSWORD"
          else
            keypass="$STORE_PASSWORD"
          fi
          APK_KEY_PASSWORD="$keypass" "$build_tools/apksigner" sign \
            --ks app/upload-keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:APK_KEY_PASSWORD \
            --out "$signed" "$aligned"
          test -s "$signed"
          "$build_tools/apksigner" verify --verbose --print-certs "$signed" > "$RUNNER_TEMP/apk-verify.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/apk-verify.txt"
          cert="$(sed -n 's/^Signer #1 certificate SHA-1 digest: //p' "$RUNNER_TEMP/apk-verify.txt" | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$EXPECTED_PLAY_UPLOAD_SHA1" | tr -d ':')"
          test "$cert" = "$expected"
          cert256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-verify.txt" | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          expected256="$(printf '%s' "$EXPECTED_PLAY_UPLOAD_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$cert256" = "$expected256"
          echo "Signed APK upload-certificate SHA256 verified"
          "$build_tools/zipalign" -c -P 16 4 "$signed"
          "$build_tools/aapt" dump badging "$signed" | grep -F "package: name='$PACKAGE_NAME' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'"
          echo "Signed APK SHA256: $(sha256sum "$signed" | awk '{print $1}')"

      - name: Upload signed APK for direct-device testing
        uses: actions/upload-artifact@v4
        with:
          name: trackmyrmc-v2.0.35-vc95-signed-test-apk
          path: frontend/android/app/build/outputs/apk/release/trackmyrmc-v2.0.35-vc95-signed.apk
          if-no-files-found: error
          retention-days: 14
