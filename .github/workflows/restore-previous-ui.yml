name: Restore Previous TrackMyRMC UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, 'Restore previous TrackMyRMC UI') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch previous TrackMyRMC frontend
        run: |
          git clone --depth 1 https://github.com/Aakruti7870/Tracking-project.git /tmp/previous-trackmyrmc

      - name: Restore previous frontend UI/UX
        run: |
          rm -rf frontend
          cp -a /tmp/previous-trackmyrmc/frontend ./frontend

          node <<'NODE'
          const fs = require('fs');
          const p = 'frontend/app.json';
          const cfg = JSON.parse(fs.readFileSync(p, 'utf8'));
          cfg.expo = cfg.expo || {};
          cfg.expo.name = 'TrackMyRMC';
          cfg.expo.slug = 'trackmyrmc';
          cfg.expo.version = '2.0.30';
          cfg.expo.web = { ...(cfg.expo.web || {}), output: 'static' };
          cfg.expo.android = {
            ...(cfg.expo.android || {}),
            package: 'com.trackmyrmc.concreteking',
            versionCode: 88
          };
          cfg.expo.ios = {
            ...(cfg.expo.ios || {}),
            bundleIdentifier: 'com.trackmyrmc.concreteking'
          };
          fs.writeFileSync(p, JSON.stringify(cfg, null, 2) + '\n');
          NODE

          # Keep the migrated production backend while retaining the previous UI implementation.
          python3 - <<'PY'
          from pathlib import Path
          for path in [Path('frontend/src/api/client.ts'), Path('frontend/src/api/upload.ts')]:
              if path.exists():
                  s = path.read_text()
                  s = s.replace(
                      'process.env.EXPO_PUBLIC_BACKEND_URL',
                      '(process.env.EXPO_PUBLIC_BACKEND_URL || process.env.EXPO_PUBLIC_API_URL)'
                  )
                  path.write_text(s)
          PY

          # Do not carry the old repository's Android signing/build workflow into the migrated repo.
          rm -rf frontend/android frontend/ios
          rm -f frontend/google-services.json

      - name: Configure production frontend environment
        run: |
          cat > frontend/.env.example <<'EOF'
          EXPO_PUBLIC_BACKEND_URL=https://trackmyrmc-backend.onrender.com
          EXPO_PUBLIC_API_URL=https://trackmyrmc-backend.onrender.com
          EOF

      - name: Validate restored frontend
        run: |
          cd frontend
          npm install
          npx tsc --noEmit

      - name: Remove one-time restore workflow
        run: rm -f .github/workflows/restore-previous-ui.yml

      - name: Commit restored UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend .github/workflows/restore-previous-ui.yml
          git commit -m "Restore previous TrackMyRMC UI" || exit 0
          git push
